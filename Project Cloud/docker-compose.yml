version: "3.8"

services:
  # --- API Gateway ---
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    restart: on-failure
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3000
      - USER_SERVICE_URL=http://user-service:3001
      - CATALOG_SERVICE_URL=http://catalog-service:8000
      - BOOKING_SERVICE_URL=http://booking-service:3002
    depends_on:
      - auth-service
      - user-service
      - catalog-service
      - booking-service
    networks:
      - app-network

  # --- Auth Service ---
  auth-service:
    build: ./auth-service
    restart: on-failure
    environment:
      - MONGO_URI=${DATABASE_URL}
      - JWT_SECRET=${SECRET}
      - PORT=3000
    networks:
      - app-network

  # --- User Service ---
  user-service:
    build: ./user-service
    restart: on-failure
    environment:
      - MONGO_URI=${DATABASE_URL}
      - JWT_SECRET=${SECRET}
    networks:
      - app-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  # --- Catalog Service ---
  catalog-service:
    build: ./catalog-service
    restart: on-failure
    environment:
      - MONGO_URI=${DATABASE_URL}
      - PORT=8000
    ports:
      - "8000:8080"
    networks:
      - app-network

  # --- Booking Service ---
  booking-service:
    build: ./booking-service
    restart: on-failure
    environment:
      - MONGO_URI=${DATABASE_URL}
      - JWT_SECRET=${SECRET}
    networks:
      - app-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  # --- Frontend ---
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    restart: on-failure
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  auth-db-data:
  user-db-data:
  catalog-db-data:
  booking-db-data:
