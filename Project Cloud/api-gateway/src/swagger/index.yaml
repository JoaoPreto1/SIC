openapi: 3.0.3
info:
  title: Project Cloud API
  description: API Gateway documentation
  version: 1.0.0

servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []

paths:
  /api/bookings:
    $ref: './bookings.yaml'
  /api/catalog:
    $ref: './catalog.yaml'
  /api/auth:
    $ref: './auth.yaml'
  /api/users:
    $ref: './users.yaml'